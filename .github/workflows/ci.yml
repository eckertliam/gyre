name: CI

# Every push, so a pull request's head commit is checked too.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SBCL_VERSION: 2.6.9
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o sbcl.tar.bz2 \
            "https://downloads.sourceforge.net/project/sbcl/sbcl/${SBCL_VERSION}/sbcl-${SBCL_VERSION}-x86-64-linux-binary.tar.bz2"
          tar xjf sbcl.tar.bz2
          cd "sbcl-${SBCL_VERSION}-x86-64-linux"
          sudo sh install.sh

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - run: sbcl --version

      - name: Test
        run: make test

      - name: Benchmark
        run: make bench
